<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030304">
<title>VÄNÄ MotorLab v34 DEV – iPhone test</title>
<style>html,body{margin:0;width:100%;height:100%;background:#030304;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#030304}#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#030304;z-index:5;font-size:13px;line-height:1.5}.bad{color:#ff6b7e}</style>
</head>
<body>
<div id="load">Ladataan v34 DEV -testiä…</div>
<iframe id="app" title="VÄNÄ MotorLab v34 DEV"></iframe>
<script>
(async()=>{
 const COMMIT='ae6f10036be8152f14ddef1b5afe1c8d1c2229d0';
 const BASE='https://cdn.jsdelivr.net/gh/anttivanttinen-max/v-n-_autodyno@'+COMMIT+'/';
 const MODULES=['diagnostics','vehicle_catalog_finland_v2_loader','vehicle_lookup','technical_specs','maintenance','gps_master_learning','raw_sync','dyno_curve_v2','ui_compact','default_dt','trip_research','research_sync','user_identity','user_features','feedback','community','merit','beta_menu','beta_release','mic_authority','sensor_persistence','sensor_autostart','admin_test_tools','phone_rpm_smart','adaptive_rpm_learning','trip_phone_raw','trip_gear_guard','trip_gear_marker','live_status','live_status_guard','motorlab_branding','simple_user_ui','v34_dashboard_ui','motorlab_i18n'];
 try{
  const r=await fetch(BASE+'index.html?cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('index '+r.status);
  let h=await r.text();
  h=h.replace('<head>','<head><base href="'+BASE+'">');
  // Test shell must stay on anttivanttinen-max.github.io origin so Railway CORS accepts login.
  // Disable the CDN-origin Service Worker only in this isolated test shell.
  h=h.replaceAll('navigator.serviceWorker.register(','Promise.resolve(');
  const tags='<script src="'+BASE+'version.js"><\/script>'+MODULES.map(n=>'<script src="'+BASE+n+'.js"><\/script>').join('');
  h=h.replace('</body>',tags+'</body>');
  const f=document.getElementById('app');f.srcdoc=h;
  f.addEventListener('load',()=>document.getElementById('load')?.remove(),{once:true});
 }catch(e){document.getElementById('load').innerHTML='<span class="bad">V34-testin lataus epäonnistui: '+String(e.message||e)+'</span>'}
})();
</script>
</body>
</html>
