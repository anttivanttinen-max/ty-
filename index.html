<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030304">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VÄNÄ MotoLab v32.9.1 FIELD – varaversio</title>
<style>html,body{margin:0;width:100%;height:100%;background:#030304;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#030304}#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#030304;z-index:5;font-size:13px;line-height:1.5}.bad{color:#ff6b7e}</style>
</head>
<body>
<div id="load">Ladataan MotoLab v32.9.1 FIELD -varaversiota…</div>
<iframe id="app" title="VÄNÄ MotoLab v32.9.1 FIELD"></iframe>
<script>
(async()=>{
 const COMMIT='c74fbbbeb2ddbc8d8f07dedc5d053c13e5c95118';
 const BASE='https://cdn.jsdelivr.net/gh/anttivanttinen-max/v-n-_autodyno@'+COMMIT+'/';
 const MODULES=['diagnostics','vehicle_lookup','technical_specs','maintenance','gps_master_learning','raw_sync','dyno_curve_v2','ui_compact','default_dt','trip_research','research_sync','beta_release','sensor_persistence','sensor_autostart','phone_rpm_smart','adaptive_rpm_learning','trip_phone_raw','trip_gear_guard','trip_gear_marker','live_status','live_status_guard'];
 try{
  const r=await fetch(BASE+'index.html?cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('index '+r.status);
  let h=await r.text();
  h=h.replace('<head>','<head><base href="'+BASE+'">');
  // Varaversio ajetaan ty- GitHub Pages -originissa. CDN-version oma Service Worker poistetaan tästä erillisestä testikuoresta.
  h=h.replaceAll('navigator.serviceWorker.register(','Promise.resolve(');
  const tags='<script src="'+BASE+'version.js"><\\/script>'+MODULES.map(n=>'<script src="'+BASE+n+'.js"><\\/script>').join('');
  h=h.replace('</body>',tags+'</body>');
  const f=document.getElementById('app');f.srcdoc=h;
  f.addEventListener('load',()=>document.getElementById('load')?.remove(),{once:true});
 }catch(e){document.getElementById('load').innerHTML='<span class="bad">Varaversion lataus epäonnistui: '+String(e.message||e)+'</span>'}
})();
</script>
</body>
</html>
