<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VÄNÄ RPM Tester v3.2</title><style>body{font-family:system-ui;background:#08090c;color:#fff;margin:0;padding:16px}main{max-width:850px;margin:auto}.c{background:#151820;border:1px solid #303744;border-radius:16px;padding:14px;margin:10px 0}button,select,input{width:100%;padding:12px;margin:5px 0;background:#0d1015;color:#fff;border:1px solid #3b4552;border-radius:10px}.go{background:#b71919;font-weight:900}.rpm{font-size:56px;font-weight:900;text-align:center}.muted{color:#aab4c1;font-size:12px}.ok{color:#38e18a}.warn{color:#ffb020}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r{background:#0d1015;border-radius:10px;padding:9px;margin:6px 0;font-size:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><h2>VÄNÄ RPM TESTER v3.2</h2><div class="muted">Standalone • erillään MotoLabista • selectedSource ja browserTrackLabel tallennetaan erikseen</div><div class="c"><div class="rpm"><span id="rpm">0</span> RPM</div><div id="sig" class="warn" style="text-align:center;font-weight:900">EI SIGNAALIA</div><div id="stats" class="muted" style="text-align:center">0 Hz • 0 % • −∞ dB</div></div><div class="c"><b>1. VALITSE MIKKI</b><select id="source"><option value="bt">BT / kuulokemikki</option><option value="phone">Puhelimen mikrofoni</option></select><select id="dev"><option value="">Järjestelmän oletusmikrofoni</option></select><button id="mic" class="go">KÄYNNISTÄ MIKKI</button><div id="track" class="muted">Ei käynnistetty</div></div><div class="c"><b>2. VALITSE MITTAUS</b><select id="point"><option>Pakoputken päästä</option><option>Äänenvaimentimen kyljestä</option><option>Paisarin kyljestä</option><option>Sylinterin / kannen läheltä</option><option>Pinnapultin jatkomutterista</option><option>Emäputki</option><option>Tanko</option><option>Satula</option><option>Runko</option></select><div class="row"><select id="target"><option>3000</option><option>4000</option><option selected>5000</option><option>6000</option><option>7000</option><option value="free">Vapaa</option></select><select id="dur"><option value="3000">3 s</option><option value="4000" selected>4 s</option><option value="6000">6 s</option></select></div><button id="test" class="go">ALOITA MITTAUS</button><div id="status" class="muted">Valmis.</div></div><div class="c"><b>TULOKSET</b><div id="results"></div><div class="row"><button id="clear">TYHJENNÄ</button><button id="share">JAA DATA</button></div></div></main><script>'use strict';const $=x=>document.getElementById(x),K='vanaRpmTesterV32';let stream,ac,an,freq,time,raf,last=0,smooth=0,testing=false,frames=[],end=0;const med=a=>{a=[...a].sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:0};async function devices(){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='audioinput'),v=$('dev').value;$('dev').innerHTML='<option value="">Järjestelmän oletusmikrofoni</option>';ds.forEach((d,i)=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Mikrofoni '+(i+1);$('dev').appendChild(o)});if([...$('dev').options].some(o=>o.value===v))$('dev').value=v}async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1};if($('dev').value)audio.deviceId={exact:$('dev').value};stream=await navigator.mediaDevices.getUserMedia({audio});let t=stream.getAudioTracks()[0];ac=new(window.AudioContext||webkitAudioContext)();await ac.resume();an=ac.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=.35;ac.createMediaStreamSource(stream).connect(an);freq=new Float32Array(an.frequencyBinCount);time=new Float32Array(an.fftSize);$('track').textContent='VALITTU LÄHDE: '+($('source').value==='bt'?'BT / KUULOKE':'PUHELIN')+' • SELAIMEN TRACK: '+(t.label||'unknown')+' • '+ac.sampleRate+' Hz';await devices();loop()}catch(e){$('track').textContent=e.name+': '+e.message}}function dbAt(h){let b=Math.round(h*an.fftSize/ac.sampleRate),m=-120;for(let i=Math.max(1,b-2);i<=Math.min(freq.length-1,b+2);i++)m=Math.max(m,freq[i]);return m}function est(){an.getFloatFrequencyData(freq);let best={s:-1,f:0,hs:[]},top=[];for(let f=25;f<=250;f+=.75){let s=0,hs=[],n=0;for(let h=1;h<=6;h++){let d=dbAt(f*h),q=Math.max(0,Math.min(1,(d+90)/70));s+=q*[0,.7,1,.95,.82,.65,.48][h];if(d>-65)n++;hs.push({h,hz:+(f*h).toFixed(2),db:+d.toFixed(2)})}s+=Math.min(.9,n*.15);let c={s,f,n,hs,rpm:f*60};top.push(c);if(s>best.s)best=c}top.sort((a,b)=>b.s-a.s);let raw=best.rpm,corr=raw;if(last){let c=[raw,raw/2,raw*2].filter(x=>x>=1500&&x<=15000),near=raw;c.forEach(x=>{if(Math.abs(x-last)<Math.abs(near-last))near=x});corr=near}smooth=smooth?smooth+.22*(corr-smooth):corr;last=corr;let conf=Math.round(Math.max(0,Math.min(100,(best.s/3.6)*100)));return{rpm:Math.round(smooth/10)*10,raw:+raw.toFixed(1),f0:+best.f.toFixed(2),conf,hs:best.hs,top:top.slice(0,5).map(x=>({rpm:+x.rpm.toFixed(1),f0:+x.f.toFixed(2),score:+x.s.toFixed(3),harmonics:x.n}))}}function level(){an.getFloatTimeDomainData(time);let s=0;for(let x of time)s+=x*x;let r=Math.sqrt(s/time.length);return r>1e-7?20*Math.log10(r):-120}function loop(){if(!an)return;let f=est(),db=level(),ok=f.conf>=40&&db>-78;$('rpm').textContent=f.rpm;$('stats').textContent=f.f0+' Hz • '+f.conf+' % • '+db.toFixed(1)+' dB';$('sig').textContent=ok?'MOOTTORISIGNAALI':'EI SIGNAALIA';$('sig').className=ok?'ok':'warn';if(testing){frames.push({...f,db,ok});if(Date.now()>=end)finish()}raf=requestAnimationFrame(loop)}function read(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}}function render(){let a=read();$('results').innerHTML=a.length?a.map(r=>'<div class="r"><b>'+r.selectedSourceLabel+' • '+r.point+' • '+r.target+'</b><br>RPM '+r.rpm+' • raw '+r.rawCandidateRpm+' • conf '+r.conf+' %<br>browserTrackLabel: '+r.browserTrackLabel+'</div>').join(''):'<div class="muted">Ei mittauksia.</div>'}function finish(){testing=false;let v=frames.filter(x=>x.ok);if(v.length<10){$('status').textContent='HYLÄTTY — mitään ei tallennettu.';return}let rep=v[Math.floor(v.length/2)],sel=$('source').value,track=stream?.getAudioTracks()[0]?.label||'unknown',r={createdAt:new Date().toISOString(),sourceType:sel,selectedSource:sel,selectedSourceLabel:sel==='bt'?'BT / kuulokemikki':'Puhelimen mikrofoni',browserTrackLabel:track,activeTrack:track,point:$('point').value,target:$('target').value==='free'?'VAPAA RPM':$('target').value+' RPM',rpm:Math.round(med(v.map(x=>x.rpm))),rawCandidateRpm:+med(v.map(x=>x.raw)).toFixed(1),f0:+med(v.map(x=>x.f0)).toFixed(1),conf:Math.round(med(v.map(x=>x.conf))),db:+med(v.map(x=>x.db)).toFixed(1),harmonicData:rep.hs,topCandidates:rep.top,sampleRate:ac.sampleRate};let a=read();a.push(r);localStorage.setItem(K,JSON.stringify(a));render();$('status').textContent='HYVÄKSYTTY JA TALLENNETTU.'} $('mic').onclick=start;$('test').onclick=async()=>{if(!an)await start();frames=[];testing=true;end=Date.now()+(+$('dur').value);$('status').textContent='MITATAAN...'};$('source').onchange=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;an=null}$('track').textContent='Lähde vaihdettu — käynnistä mikki uudelleen.'};$('clear').onclick=()=>{localStorage.removeItem(K);render()};$('share').onclick=async()=>{let results=read(),payload={schema:'vana-rpm-tester-v3.2',exportedAt:new Date().toISOString(),results},text=JSON.stringify(payload,null,2),file=new File([text],'vana-rpm-tester-v32.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'VÄNÄ RPM Tester data'});else if(navigator.share)await navigator.share({text});else await navigator.clipboard.writeText(text)};devices();render();</script></body></html>
